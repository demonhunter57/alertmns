server {
    listen 80;
    server_name mns-vmd-cda5-037.mns.lan 192.168.23.28;

    root /var/www/alertmns;
    index index.html;

    # ── Fichiers statiques Angular ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API REST → Spring Boot :4000 ────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── H2 Console (désactivée en prod, mais accessible si besoin) ──
    location /h2-console/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── WebSocket STOMP / SockJS → Spring Boot :4000 ────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SockJS fallback (polling HTTP) ──────────────────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
