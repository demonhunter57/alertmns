# ======================================================
# AlertMNS — Spring Boot Application Configuration
# ======================================================

# ----- Server -----
server.port=4000

# ----- H2 In-Memory Database -----
spring.datasource.url=jdbc:h2:mem:alertmns;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----- JWT -----
app.jwt.secret=alertmns_super_secret_key_change_in_production_min_32_chars
app.jwt.expiration-ms=604800000

# ----- CORS (Angular dev server) -----
app.cors.allowed-origins=http://localhost:4200

# ----- Logging -----
logging.level.com.alertmns=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=WARN
