# ======================================================
# AlertMNS — Configuration PRODUCTION
# ======================================================

# ----- Server -----
server.port=4000

# ----- H2 In-Memory Database (prod légère) -----
# Pour une vraie prod, remplacer par PostgreSQL ci-dessous
spring.datasource.url=jdbc:h2:mem:alertmns;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ----- JWT (changer le secret en production !) -----
app.jwt.secret=alertmns_PROD_secret_key_mns_cda5_037_2026_very_long_key_ok
app.jwt.expiration-ms=604800000

# ----- CORS — domaine VM MNS -----
app.cors.allowed-origins=http://mns-vmd-cda5-037.mns.lan,http://192.168.23.28

# ----- Logging -----
logging.level.com.alertmns=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=WARN
